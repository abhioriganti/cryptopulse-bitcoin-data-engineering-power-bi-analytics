version: 2

sources:
  - name: raw
    description: Validated streaming Gold handoff loaded from Delta into PostgreSQL.
    schema: raw
    tables:
      - name: market_bars
        description: One row per provider, symbol, interval, and event-time bar.
        columns:
          - name: bar_start
            tests: [not_null]
          - name: provider
            tests: [not_null]
          - name: symbol
            tests: [not_null]
          - name: interval
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["1 minute", "5 minutes", "15 minutes", "1 hour"]
      - name: reconciliation_results
        description: Historical row-count reconciliation outcomes for each pipeline run.
        columns:
          - name: reconciliation_id
            tests: [not_null, unique]
          - name: run_id
            tests: [not_null]
          - name: status
            tests:
              - accepted_values:
                  arguments:
                    values: ["pass", "fail"]
