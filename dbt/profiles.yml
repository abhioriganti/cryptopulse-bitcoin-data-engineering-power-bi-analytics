# No secret is stored here. Set CRYPTOPULSE_DBT_PASSWORD before invoking dbt.
cryptopulse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('CRYPTOPULSE_DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('CRYPTOPULSE_DBT_PORT', '5432') | int }}"
      user: "{{ env_var('CRYPTOPULSE_DBT_USER', 'cryptopulse') }}"
      password: "{{ env_var('CRYPTOPULSE_DBT_PASSWORD') }}"
      dbname: "{{ env_var('CRYPTOPULSE_DBT_DATABASE', 'cryptopulse') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
