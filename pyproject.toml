[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptopulse"
version = "0.1.0"
description = "Local-first Bitcoin market intelligence data platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "CryptoPulse Contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "structlog>=24.4,<26",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "prometheus-client>=0.20,<1",
  "boto3>=1.35,<2",
  "confluent-kafka>=2.5,<3",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pre-commit>=4.0,<5",
  "types-requests>=2.32,<3",
]
streaming = ["pyspark>=3.5.9,<4", "delta-spark>=3.3,<4", "confluent-kafka>=2.5,<3"]
analytics = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "dbt-postgres>=1.8,<2"]
ml = ["scikit-learn>=1.5,<2", "xgboost>=2.1,<3", "statsmodels>=0.14,<1", "mlflow>=2.16,<3"]

[project.scripts]
cryptopulse-api = "cryptopulse.api.main:run"
cryptopulse-backfill = "cryptopulse.ingestion.backfill:main"
cryptopulse-live = "cryptopulse.ingestion.live:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptopulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cryptopulse"]
