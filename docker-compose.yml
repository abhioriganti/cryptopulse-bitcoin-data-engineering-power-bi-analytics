name: cryptopulse

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092"]
    ports: ["19092:19092"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2024-08-26T15-33-07Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${CRYPTOPULSE_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${CRYPTOPULSE_S3_SECRET_KEY:?set in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptopulse
      POSTGRES_PASSWORD: cryptopulse
      POSTGRES_DB: cryptopulse
    ports: ["15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptopulse -d cryptopulse"]
      interval: 10s
      timeout: 5s
      retries: 10
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    volumes: ["grafana-data:/var/lib/grafana", "./infra/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on:
      prometheus:
        condition: service_started
  spark:
    build:
      context: .
      dockerfile: infra/docker/spark/Dockerfile
    environment:
      PYTHONPATH: /workspace/src
      CRYPTOPULSE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CRYPTOPULSE_S3_ENDPOINT: http://minio:9000
      CRYPTOPULSE_S3_BUCKET: ${CRYPTOPULSE_S3_BUCKET:?set in .env}
      CRYPTOPULSE_S3_ACCESS_KEY: ${CRYPTOPULSE_S3_ACCESS_KEY:?set in .env}
      CRYPTOPULSE_S3_SECRET_KEY: ${CRYPTOPULSE_S3_SECRET_KEY:?set in .env}
      CRYPTOPULSE_POSTGRES_DSN: postgresql://cryptopulse:cryptopulse@postgres:5432/cryptopulse
      CRYPTOPULSE_MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./:/workspace
      - spark-ivy:/root/.ivy2
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["sleep", "infinity"]
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    environment:
      PYTHONPATH: /workspace/src
      CRYPTOPULSE_POSTGRES_DSN: postgresql://cryptopulse:cryptopulse@postgres:5432/cryptopulse
    ports: ["8000:8000"]
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "cryptopulse.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
  dbt:
    build:
      context: .
      dockerfile: infra/docker/dbt/Dockerfile
    environment:
      CRYPTOPULSE_DBT_HOST: postgres
      CRYPTOPULSE_DBT_USER: cryptopulse
      CRYPTOPULSE_DBT_PASSWORD: cryptopulse
      CRYPTOPULSE_DBT_DATABASE: cryptopulse
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]
  airflow-init:
    image: apache/airflow:2.10.3
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://cryptopulse:cryptopulse@postgres:5432/cryptopulse
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes: ["./airflow/dags:/opt/airflow/dags:ro"]
    depends_on:
      postgres:
        condition: service_healthy
    command: db migrate
    restart: "no"
  airflow-scheduler:
    image: apache/airflow:2.10.3
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://cryptopulse:cryptopulse@postgres:5432/cryptopulse
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes: ["./airflow/dags:/opt/airflow/dags:ro"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  redpanda-data:
  minio-data:
  postgres-data:
  grafana-data:
  spark-ivy:
